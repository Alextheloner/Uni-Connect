services:
  - type: web
    name: uni-connect
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn uniconnect.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uni-connect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false

databases:
  - name: uni-connect-db
    plan: free
